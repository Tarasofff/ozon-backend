[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.scripts]
app = "cli.main:main"
generate-keys = "scripts.generate_jwt_keys:main"
migrate-db = "app.scripts.migrate:main"
seed-db = "app.db.seeders.seed_run:main"
[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)"
]
